[tool.ruff]
line-length = 120
target-version = "py312"

[tool.ruff.lint]
select = [
    "E",   # pycodestyle errors
    "F",   # pyflakes
    "I",   # isort
    "UP",  # pyupgrade
    "B",   # flake8-bugbear
    "SIM", # flake8-simplify
]
ignore = [
    "E501", # line length is handled by the formatter, not worth failing CI over
    "B008", # FastAPI's Depends(...)/Query(...) defaults are the intended pattern, not a bug
]

[tool.ruff.lint.per-file-ignores]
# Import order in main.py is safety-critical (Windows DLL collision guard, see the
# comment in the file itself): torch/reranker warmup must stay ahead of the routes
# import. Never let isort or --fix touch this file's import block.
"main.py" = ["I001", "E402"]
# __init__.py files re-export names as a package's public surface on purpose.
"__init__.py" = ["F401"]
# `assert False, "..."` in a try/except is a common, harmless idiom for
# "this line should be unreachable" and reads clearer than raising manually.
"tests/**" = ["B011"]

[tool.ruff.format]
quote-style = "double"

[tool.mypy]
python_version = "3.12"
ignore_missing_imports = true
warn_unused_ignores = true
warn_redundant_casts = true
check_untyped_defs = true
exclude = ["tests/"]

[[tool.mypy.overrides]]
module = "tests.*"
ignore_errors = true