<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 120 120">
  <defs>
    <!-- Deep Blue to Cyan Gradient -->
    <linearGradient id="grad1" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#1E3A8A" />
      <stop offset="100%" stop-color="#06B6D4" />
    </linearGradient>
    
    <!-- Deep Purple to Bright Blue Gradient -->
    <linearGradient id="grad2" x1="0%" y1="100%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#4C1D95" />
      <stop offset="100%" stop-color="#3B82F6" />
    </linearGradient>
  </defs>

  <!-- 
    Note: There is no <rect> background tag here. 
    This ensures the background remains 100% transparent. 
  -->

  <!-- Interlocking Orbital Rings forming the core 'O' -->
  <g fill="none" stroke-width="3">
    <!-- Main central ring -->
    <circle cx="60" cy="60" r="35" stroke="url(#grad1)" />
    
    <!-- Diagonal intersecting rings for the vortex effect -->
    <ellipse cx="60" cy="60" rx="25" ry="45" transform="rotate(45 60 60)" stroke="url(#grad2)" />
    <ellipse cx="60" cy="60" rx="25" ry="45" transform="rotate(-45 60 60)" stroke="url(#grad1)" />
    
    <!-- Outer partial arcs to suggest continuous movement -->
    <path d="M 60 15 A 45 45 0 0 1 105 60" stroke="url(#grad2)" stroke-linecap="round"/>
    <path d="M 60 105 A 45 45 0 0 1 15 60" stroke="url(#grad1)" stroke-linecap="round"/>
  </g>

  <!-- Connecting Network Lines (The "Research" data connections) -->
  <g stroke="#60A5FA" stroke-width="1.2" opacity="0.5">
    <line x1="28" y1="28" x2="42" y2="42" />
    <line x1="92" y1="28" x2="78" y2="42" />
    <line x1="28" y1="92" x2="42" y2="78" />
    <line x1="92" y1="92" x2="78" y2="78" />
    <line x1="15" y1="60" x2="25" y2="60" />
    <line x1="105" y1="60" x2="95" y2="60" />
    <line x1="60" y1="15" x2="60" y2="25" />
    <line x1="60" y1="105" x2="60" y2="95" />
    <line x1="28" y1="28" x2="60" y2="15" />
    <line x1="92" y1="92" x2="60" y2="105" />
    <line x1="15" y1="60" x2="28" y2="92" />
    <line x1="105" y1="60" x2="92" y2="28" />
  </g>

  <!-- Data Nodes (The intersection dots) -->
  <g fill="url(#grad1)">
    <!-- Outer perimeter nodes -->
    <circle cx="60" cy="15" r="4" />
    <circle cx="105" cy="60" r="4" fill="url(#grad2)"/>
    <circle cx="60" cy="105" r="4" />
    <circle cx="15" cy="60" r="4" fill="url(#grad2)"/>
    
    <!-- Mid-level diagonal intersections -->
    <circle cx="28" cy="28" r="3.5" />
    <circle cx="92" cy="28" r="3.5" fill="url(#grad2)"/>
    <circle cx="28" cy="92" r="3.5" fill="url(#grad2)"/>
    <circle cx="92" cy="92" r="3.5" />

    <!-- Inner central intersections -->
    <circle cx="42" cy="42" r="2.5" />
    <circle cx="78" cy="42" r="2.5" fill="url(#grad2)"/>
    <circle cx="42" cy="78" r="2.5" fill="url(#grad2)"/>
    <circle cx="78" cy="78" r="2.5" />
    
    <!-- Inner cardinal intersections -->
    <circle cx="60" cy="25" r="2.5" />
    <circle cx="95" cy="60" r="2.5" fill="url(#grad2)"/>
    <circle cx="60" cy="95" r="2.5" />
    <circle cx="25" cy="60" r="2.5" fill="url(#grad2)"/>
  </g>
</svg>
