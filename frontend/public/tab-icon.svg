<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64">
  <defs>
    <!-- Modern Blue/Cyan Gradient for the Omni Ring -->
    <linearGradient id="omniGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#4F46E5;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#06B6D4;stop-opacity:1" />
    </linearGradient>
    
    <!-- Vibrant Pink/Purple Gradient for the Research Nodes -->
    <linearGradient id="nodeGrad" x1="0%" y1="100%" x2="100%" y2="0%">
      <stop offset="0%" style="stop-color:#EC4899;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#8B5CF6;stop-opacity:1" />
    </linearGradient>
  </defs>

  <!-- Outer Omni Circle (The Lens Rim) -->
  <circle cx="28" cy="28" r="20" fill="url(#omniGrad)" />
  
  <!-- Inner Lens Cutout for Contrast -->
  <circle cx="28" cy="28" r="14" fill="#ffffff" />
  
  <!-- Network Nodes inside the lens (The Research Data) -->
  <circle cx="24" cy="24" r="2.5" fill="url(#nodeGrad)"/>
  <circle cx="32" cy="32" r="2.5" fill="url(#nodeGrad)"/>
  <circle cx="22" cy="32" r="2.5" fill="url(#nodeGrad)"/>
  
  <!-- Connecting Lines for the Nodes -->
  <path d="M24 24 L32 32 M24 24 L22 32 M22 32 L32 32" stroke="url(#nodeGrad)" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/>
  
  <!-- Magnifying Glass Handle -->
  <path d="M42 42 L56 56" stroke="url(#omniGrad)" stroke-width="8" stroke-linecap="round" />
</svg>
