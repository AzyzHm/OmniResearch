name: Documentation
description: Report missing, unclear, or incorrect documentation
title: "[Docs]: "
labels: ["documentation"]
body:
  - type: checkboxes
    attributes:
      label: Checked for duplicates
      options:
        - label: I searched existing issues and didn't find one already open for this
          required: true

  - type: input
    attributes:
      label: Location
      description: File, README section, or page this is about.
      placeholder: "e.g. backend/docs/README.md, section 'Environment Variables'"
    validations:
      required: true

  - type: textarea
    attributes:
      label: What's wrong or missing
    validations:
      required: true

  - type: textarea
    attributes:
      label: Suggested fix (optional)